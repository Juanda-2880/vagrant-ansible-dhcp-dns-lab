name: Build Rocky 9 Infra Image

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Construir la imagen de Docker
        run: |
          docker build -t rocky9-dns-dhcp:latest .
          
      - name: Probar que la imagen levanta correctamente
        run: |
          # Corre el contenedor en background para ver si los servicios inician sin caerse
          docker run -d --name infra-test rocky9-dns-dhcp:latest
          sleep 5
          docker logs infra-test